<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Đăng nhập - NeoPanel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f7fb;
            font-family: Inter, system-ui, sans-serif;
            color: #0f172a;
        }
        .wrap { width: 100%; max-width: 420px; }
        .brand { text-align: center; margin-bottom: 24px; }
        .brand-icon {
            display: inline-grid; place-items: center;
            width: 44px; height: 44px;
            background: #2563eb; color: #fff;
            border-radius: 12px; font-weight: 800; font-size: 18px;
            margin-bottom: 12px;
        }
        .brand-name { font-size: 22px; font-weight: 700; }
        .brand-sub { color: #64748b; font-size: 13px; margin-top: 4px; }
        .card {
            background: #fff;
            border: 1px solid #e6ebf3;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
        }
        h1 { font-size: 20px; margin-bottom: 4px; }
        .subtitle { color: #64748b; font-size: 13px; margin-bottom: 24px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        input {
            width: 100%; height: 42px; padding: 0 12px;
            border: 1px solid #e6ebf3; border-radius: 10px;
            background: #f8fafc; margin-bottom: 16px; outline: none;
        }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); background: #fff; }
        button {
            width: 100%; height: 42px; border: 0; border-radius: 10px;
            background: #2563eb; color: #fff; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .error {
            margin-bottom: 16px; padding: 12px; border-radius: 10px;
            background: #fef2f2; color: #dc2626; font-size: 13px;
        }
        .foot { text-align: center; margin-top: 20px; color: #94a3b8; font-size: 12px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">
            <div class="brand-icon">N</div>
            <div class="brand-name">NeoPanel</div>
            <div class="brand-sub">Hosting Control Panel</div>
        </div>
        <main class="card">
            <h1>Đăng nhập</h1>
            <p class="subtitle">Đăng nhập để quản lý hệ thống hosting.</p>
            {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
            <form method="post" action="/login">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="username">Tên đăng nhập</label>
                <input id="username" name="username" type="text" placeholder="Nhập tên đăng nhập" autocomplete="username" maxlength="50" required autofocus>
                <label for="password">Mật khẩu</label>
                <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                <button type="submit">Đăng nhập</button>
            </form>
        </main>
        <div class="foot">NeoPanel v1.0 · Hosting Control Panel</div>
    </div>
</body>
</html>
